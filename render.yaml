services:
  - type: web
    name: zone-online-multiplayer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: ZONE_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
